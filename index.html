<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Vault" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#14181B" />
<link rel="icon" type="image/png" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="manifest" href="manifest.json" />

<title>Vault</title>
<style>
  
  :root {
    --bg: #d9c9a3; --surface: #efe6cb; --surface-raised: #f6f0dd;
    --border: #b8a67d; --text: #2a2013; --text-dim: #6b5d42;
    --accent: #a9762f; --danger: #a5432f; --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text); font-size: 18px;
    font-family: Arial, Helvetica, sans-serif; -webkit-font-smoothing: antialiased;
  }
  button {
    font-family: inherit; cursor: pointer; border: none; border-radius: 8px;
    padding: 12px 20px; font-size: 17px; font-weight: 600; background: var(--accent);
    color: #fdf8ec; transition: filter 0.15s ease;
  }
  button:hover { filter: brightness(1.08); }
  button:disabled { opacity: 0.6; cursor: default; }
  button:focus-visible, input:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .btn-ghost { background: transparent; color: var(--text-dim); border: 1px solid var(--border); }
  .btn-ghost:hover { color: var(--text); filter: none; border-color: var(--text-dim); }
  .link-btn {
    background: none; border: none; color: var(--accent); font-weight: 500; font-size: 16px;
    padding: 0; margin-top: 18px; display: block; width: 100%; text-align: center;
  }
  .link-btn:hover { filter: none; text-decoration: underline; }
  label { display: block; font-size: 16px; color: var(--text-dim); margin: 12px 0 5px; }
  input, textarea, select {
    width: 100%; background: var(--surface-raised); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px 13px; color: var(--text); font-size: 18px; font-family: inherit;
  }
  textarea { resize: vertical; }
  .msg { margin-top: 14px; padding: 10px 12px; border-radius: 8px; font-size: 15px; line-height: 1.4; }
  .msg.error { background: rgba(192,96,79,0.15); color: #e09385; border: 1px solid rgba(192,96,79,0.35); }
  .msg.success { background: rgba(201,162,75,0.12); color: var(--accent); border: 1px solid rgba(201,162,75,0.3); }

  .auth-screen { min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 24px; padding-top: 14vh; }
  .auth-card { width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 26px 24px; }
  .mark { font-family: Arial, Helvetica, sans-serif; font-weight: 600; font-size: 18px; letter-spacing: 0.28em; color: var(--accent); margin-bottom: 18px; }
  .auth-card h1 { font-family: Arial, Helvetica, sans-serif; font-size: 30px; font-weight: 500; margin: 0 0 6px; }
  .auth-sub { color: var(--text-dim); font-size: 17px; margin: 0; line-height: 1.5; }
  .auth-card button[type='submit'] { width: 100%; margin-top: 20px; padding: 12px; }

  .wrap { max-width: 680px; margin: 0 auto; padding: 64px 20px 60px; }
  .header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 22px; }
  .user-email { color: var(--text-dim); font-size: 16px; }
  .toolbar { display: flex; gap: 10px; margin-bottom: 20px; }
  .search { flex: 1; }
  .empty-state { padding: 48px 16px; text-align: center; color: var(--text-dim); }
  .list { display: flex; flex-direction: column; gap: 10px; }
  .row { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
  .row-main { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .row-name { font-weight: 600; font-size: 18px; }
  .row-owner { color: var(--text-dim); font-size: 16px; }
  .row-password { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .row-password .cred-block { order: 1; flex: 1; }
  .row-password .btn-stack { order: 2; }
  .btn-stack { display: flex; gap: 8px; }
  .cred-block { display: flex; flex-direction: column; gap: 2px; overflow-wrap: anywhere; }
  .username-text { font-family: Arial, Helvetica, sans-serif; font-size: 15px; color: var(--text-dim); }
  .pw-text { font-family: Arial, Helvetica, sans-serif; font-size: 17px; letter-spacing: 0.03em; color: var(--accent); }
  .row-notes { margin-top: 10px; font-size: 16px; color: var(--text-dim); white-space: pre-wrap; line-height: 1.5; border-top: 1px solid var(--border); padding-top: 10px; }
  .row-actions { display: flex; gap: 8px; margin-top: 12px; }
  .icon-btn { background: var(--surface-raised); color: var(--text-dim); border: 1px solid var(--border); padding: 7px 12px; font-size: 15px; font-weight: 500; }
  .icon-btn:hover { color: var(--text); filter: none; }
  .icon-btn.danger:hover { color: var(--danger); border-color: var(--danger); }
  .form-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 16px; }
  .form-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }

  @media (max-width: 480px) {
    .toolbar { flex-direction: column; }
    .row-main { flex-direction: column; gap: 2px; }

    body { font-size: 22px; }
    label { font-size: 20px; margin: 10px 0 4px; }
    input, textarea, select { font-size: 22px; padding: 8px 10px; }
    button { font-size: 21px; padding: 8px 14px; }
    .mark { font-size: 22px; }
    .auth-card h1 { font-size: 36px; }
    .auth-sub { font-size: 20px; }
    .user-email { font-size: 19px; }
    .search { font-size: 22px; }
    .row-name { font-size: 22px; }
    .row-owner { font-size: 19px; }
    .pw-text { font-size: 21px; }
    .cred-block { flex-direction: row; gap: 6px; flex-wrap: wrap; align-items: baseline; }
    .username-text { font-size: 19px; }
    .username-text::after { content: '\00b7'; margin-left: 6px; color: var(--text-dim); }
    .row-notes { font-size: 19px; }
    .icon-btn { font-size: 18px; padding: 5px 10px; }
    .link-btn { font-size: 19px; }
    .auth-card { padding: 20px 16px; }
    .row { padding: 10px 12px; }
    .form-card { padding: 14px 12px; }
    .row-password { align-items: flex-start; }
    .btn-stack { display: flex; flex-direction: column; gap: 6px; }
    .btn-stack .icon-btn { width: 84px; text-align: center; }
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<div id="authScreen" class="auth-screen" hidden>
  <div class="auth-card">
    <div class="mark">VAULT</div>
    <h1 id="authTitle">Sign in</h1>
    <p class="auth-sub" id="authSub">Access your stored logins.</p>
    <form id="authForm">
      <label for="email">Email</label>
      <input id="email" type="email" required autocomplete="email" />
      <label for="password">Password</label>
      <input id="password" type="password" required minlength="6" autocomplete="current-password" />
      <button type="submit" id="authSubmit">Sign in</button>
    </form>
    <div id="authMsg"></div>
    <button class="link-btn" id="authToggle">Don't have an account? Create one</button>
  </div>
</div>

<div id="vaultScreen" class="wrap" hidden>
  <div class="header">
    <div>
      <div class="mark">VAULT</div>
      <div class="user-email" id="userEmail"></div>
    </div>
    <button class="btn-ghost" id="signOutBtn">Sign out</button>
  </div>

  <div id="listView">
    <div class="toolbar">
      <input id="search" class="search" placeholder="Search by name, owner, or notes" />
      <button id="addBtn">Add entry</button>
    </div>
    <div id="vaultMsg"></div>
    <div id="listWrap"><div class="empty-state">Loading…</div></div>
  </div>

  <div id="formView" hidden>
    <div class="form-card">
      <h3 id="formTitle" style="margin-top:0;font-family:Arial,Helvetica,sans-serif;font-weight:500;"></h3>
      <form id="entryForm">
        <label for="f-owner">Owner</label>
        <select id="f-owner">
          <option value="Jeff">Jeff</option>
          <option value="Joan">Joan</option>
          <option value="Mom">Mom</option>
          <option value="Ed">Ed</option>
          <option value="other">Other…</option>
        </select>
        <input id="f-owner-other" placeholder="Enter owner name" hidden />

        <label for="f-name">Name</label>
        <input id="f-name" required placeholder="e.g. Bank of Northwest MO" />
        <label for="f-username">Username</label>
        <input id="f-username" placeholder="e.g. jfarnan or an email address" />
        <label for="f-password">Password</label>
        <input id="f-password" required placeholder="Password" />
        <label for="f-notes">Notes</label>
        <textarea id="f-notes" rows="3" placeholder="Security questions, anything else"></textarea>
        <div class="form-actions">
          <button type="button" id="cancelBtn" class="btn-ghost">Cancel</button>
          <button type="submit" id="saveBtn">Save entry</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>
  // Paste in the two values from your Supabase project's Settings -> API page,
  // then save this file. That's the only setup this app needs.
  //
  // The anon key is safe to have here — it's meant to be public.
  // Your data is actually protected by the Row Level Security rules
  // in supabase_schema.sql, not by hiding this key.
  const SUPABASE_URL = 'https://iwxlyeaxlkqmjottaxkx.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_WoR_OZhb_3tMTRJhPeozVg_LwLp-73a';

  const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ---------- element refs ----------
  const authScreen = document.getElementById('authScreen');
  const vaultScreen = document.getElementById('vaultScreen');
  const authForm = document.getElementById('authForm');
  const authTitle = document.getElementById('authTitle');
  const authSub = document.getElementById('authSub');
  const authSubmit = document.getElementById('authSubmit');
  const authToggle = document.getElementById('authToggle');
  const authMsg = document.getElementById('authMsg');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');

  const userEmail = document.getElementById('userEmail');
  const signOutBtn = document.getElementById('signOutBtn');
  const listView = document.getElementById('listView');
  const formView = document.getElementById('formView');
  const listWrap = document.getElementById('listWrap');
  const vaultMsg = document.getElementById('vaultMsg');
  const searchInput = document.getElementById('search');
  const addBtn = document.getElementById('addBtn');
  const cancelBtn = document.getElementById('cancelBtn');
  const entryForm = document.getElementById('entryForm');
  const formTitle = document.getElementById('formTitle');

  let authMode = 'sign_in';
  let session = null;
  let entries = [];
  let editingId = null;

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str ?? '';
    return d.innerHTML;
  }

  // ---------- auth ----------
  authToggle.addEventListener('click', () => {
    authMode = authMode === 'sign_in' ? 'sign_up' : 'sign_in';
    authMsg.innerHTML = '';
    if (authMode === 'sign_in') {
      authTitle.textContent = 'Sign in';
      authSub.textContent = 'Access your stored logins.';
      authSubmit.textContent = 'Sign in';
      authToggle.textContent = "Don't have an account? Create one";
      passwordInput.autocomplete = 'current-password';
    } else {
      authTitle.textContent = 'Create your account';
      authSub.textContent = 'This will be the only account with access to your vault.';
      authSubmit.textContent = 'Create account';
      authToggle.textContent = 'Already have an account? Sign in';
      passwordInput.autocomplete = 'new-password';
    }
  });

  authForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    authSubmit.disabled = true;
    authSubmit.textContent = 'Working…';
    authMsg.innerHTML = '';

    const email = emailInput.value;
    const password = passwordInput.value;

    if (authMode === 'sign_in') {
      const { error } = await client.auth.signInWithPassword({ email, password });
      if (error) authMsg.innerHTML = `<div class="msg error">${escapeHtml(error.message)}</div>`;
    } else {
      const { error } = await client.auth.signUp({ email, password });
      if (error) {
        authMsg.innerHTML = `<div class="msg error">${escapeHtml(error.message)}</div>`;
      } else {
        authMsg.innerHTML = `<div class="msg success">Account created. Check your email to confirm, then sign in.</div>`;
      }
    }
    authSubmit.disabled = false;
    authSubmit.textContent = authMode === 'sign_in' ? 'Sign in' : 'Create account';
  });

  signOutBtn.addEventListener('click', () => client.auth.signOut());

  client.auth.onAuthStateChange((_event, s) => {
    session = s;
    if (session) {
      authScreen.hidden = true;
      vaultScreen.hidden = false;
      userEmail.textContent = session.user.email;
      loadEntries();
    } else {
      vaultScreen.hidden = true;
      authScreen.hidden = false;
    }
  });

  // ---------- vault ----------
  async function loadEntries() {
    vaultMsg.innerHTML = '';
    const { data, error } = await client.from('passwords').select('*').order('name', { ascending: true });
    if (error) {
      vaultMsg.innerHTML = `<div class="msg error">${escapeHtml(error.message)}</div>`;
      return;
    }
    entries = data;
    render();
  }

  const OWNER_PRESETS = ['Jeff', 'Joan', 'Mom', 'Ed'];
  const ownerSelect = document.getElementById('f-owner');
  const ownerOther = document.getElementById('f-owner-other');

  ownerSelect.addEventListener('change', () => {
    ownerOther.hidden = ownerSelect.value !== 'other';
    if (!ownerOther.hidden) ownerOther.focus();
  });

  function setOwnerValue(owner) {
    if (OWNER_PRESETS.includes(owner)) {
      ownerSelect.value = owner;
      ownerOther.hidden = true;
      ownerOther.value = '';
    } else {
      ownerSelect.value = 'other';
      ownerOther.hidden = false;
      ownerOther.value = owner || '';
    }
  }

  function getOwnerValue() {
    return ownerSelect.value === 'other' ? ownerOther.value.trim() : ownerSelect.value;
  }

  function openForm(entry) {
    editingId = entry ? entry.id : null;
    formTitle.textContent = entry ? 'Edit entry' : 'Add entry';
    setOwnerValue(entry ? entry.owner : 'Jeff');
    document.getElementById('f-name').value = entry ? entry.name : '';
    document.getElementById('f-username').value = entry ? entry.username || '' : '';
    document.getElementById('f-password').value = entry ? entry.password : '';
    document.getElementById('f-notes').value = entry ? entry.notes || '' : '';
    listView.hidden = true;
    formView.hidden = false;
    document.getElementById('f-name').focus();
  }

  function closeForm() {
    formView.hidden = true;
    listView.hidden = false;
    editingId = null;
  }

  addBtn.addEventListener('click', () => openForm(null));
  cancelBtn.addEventListener('click', closeForm);
  searchInput.addEventListener('input', render);

  entryForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const owner = getOwnerValue();
    const name = document.getElementById('f-name').value.trim();
    const username = document.getElementById('f-username').value.trim();
    const password = document.getElementById('f-password').value;
    const notes = document.getElementById('f-notes').value.trim();
    if (!owner || !name || !password) return;

    const saveBtn = document.getElementById('saveBtn');
    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving…';


    let error;
    if (editingId) {
      ({ error } = await client.from('passwords').update({ owner, name, username, password, notes }).eq('id', editingId));
    } else {
      ({ error } = await client.from('passwords').insert({ owner, name, username, password, notes, user_id: session.user.id }));
    }

    saveBtn.disabled = false;
    saveBtn.textContent = 'Save entry';

    if (error) {
      vaultMsg.innerHTML = `<div class="msg error">${escapeHtml(error.message)}</div>`;
      return;
    }
    closeForm();
    loadEntries();
  });

  async function deleteEntry(id) {
    const entry = entries.find((x) => x.id === id);
    if (!entry) return;
    if (!confirm(`Delete the entry for "${entry.name}"? This can't be undone.`)) return;
    const { error } = await client.from('passwords').delete().eq('id', id);
    if (error) {
      vaultMsg.innerHTML = `<div class="msg error">${escapeHtml(error.message)}</div>`;
      return;
    }
    entries = entries.filter((x) => x.id !== id);
    render();
  }

  function render() {
    const q = searchInput.value.trim().toLowerCase();
    const filtered = !q
      ? entries
      : entries.filter(
          (e) =>
            e.name.toLowerCase().includes(q) ||
            e.owner.toLowerCase().includes(q) ||
            (e.username || '').toLowerCase().includes(q) ||
            (e.notes || '').toLowerCase().includes(q)
        );

    if (entries.length === 0) {
      listWrap.innerHTML = `<div class="empty-state">No entries yet. Add your first one.</div>`;
      return;
    }
    if (filtered.length === 0) {
      listWrap.innerHTML = `<div class="empty-state">Nothing matches that search.</div>`;
      return;
    }

    listWrap.innerHTML = `<div class="list">${filtered.map(rowHtml).join('')}</div>`;

    filtered.forEach((entry) => {
      const row = document.getElementById(`row-${entry.id}`);
      row.querySelector('.edit-btn').addEventListener('click', () => openForm(entry));
      row.querySelector('.delete-btn').addEventListener('click', () => deleteEntry(entry.id));
    });
  }

  function rowHtml(entry) {
    return `
      <div class="row" id="row-${entry.id}">
        <div class="row-main">
          <div class="row-name">${escapeHtml(entry.name)}</div>
          <div class="row-owner">${escapeHtml(entry.owner)}</div>
        </div>
        <div class="row-password">
          <div class="btn-stack">
            <button type="button" class="icon-btn edit-btn">Edit</button>
            <button type="button" class="icon-btn danger delete-btn">Delete</button>
          </div>
          <div class="cred-block">
            ${entry.username ? `<div class="username-text">${escapeHtml(entry.username)}</div>` : ''}
            <div class="pw-text">${escapeHtml(entry.password)}</div>
          </div>
        </div>
        ${entry.notes ? `<div class="row-notes">${escapeHtml(entry.notes)}</div>` : ''}
      </div>
    `;
  }

  // ---------- boot ----------
  client.auth.getSession().then(({ data: { session: s } }) => {
    session = s;
    if (session) {
      authScreen.hidden = true;
      vaultScreen.hidden = false;
      userEmail.textContent = session.user.email;
      loadEntries();
    } else {
      authScreen.hidden = false;
    }
  });
</script>
</body>
</html>
