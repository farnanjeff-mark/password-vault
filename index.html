<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#14181B" />
<title>Vault</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap');

  :root {
    --bg: #14181b; --surface: #1d2226; --surface-raised: #232a2f;
    --border: #2b3238; --text: #edeff0; --text-dim: #8b949a;
    --accent: #c9a24b; --danger: #c0604f; --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased;
  }
  button {
    font-family: inherit; cursor: pointer; border: none; border-radius: 8px;
    padding: 11px 18px; font-size: 14px; font-weight: 600; background: var(--accent);
    color: #1a1305; transition: filter 0.15s ease;
  }
  button:hover { filter: brightness(1.08); }
  button:disabled { opacity: 0.6; cursor: default; }
  button:focus-visible, input:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .btn-ghost { background: transparent; color: var(--text-dim); border: 1px solid var(--border); }
  .btn-ghost:hover { color: var(--text); filter: none; border-color: var(--text-dim); }
  .link-btn {
    background: none; border: none; color: var(--accent); font-weight: 500; font-size: 13px;
    padding: 0; margin-top: 18px; display: block; width: 100%; text-align: center;
  }
  .link-btn:hover { filter: none; text-decoration: underline; }
  label { display: block; font-size: 13px; color: var(--text-dim); margin: 14px 0 6px; }
  input, textarea {
    width: 100%; background: var(--surface-raised); border: 1px solid var(--border);
    border-radius: 8px; padding: 11px 12px; color: var(--text); font-size: 15px; font-family: inherit;
  }
  textarea { resize: vertical; }
  .msg { margin-top: 14px; padding: 10px 12px; border-radius: 8px; font-size: 13px; line-height: 1.4; }
  .msg.error { background: rgba(192,96,79,0.15); color: #e09385; border: 1px solid rgba(192,96,79,0.35); }
  .msg.success { background: rgba(201,162,75,0.12); color: var(--accent); border: 1px solid rgba(201,162,75,0.3); }

  .auth-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .auth-card { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 32px 28px; }
  .mark { font-family: 'Fraunces', serif; font-weight: 600; font-size: 15px; letter-spacing: 0.28em; color: var(--accent); margin-bottom: 18px; }
  .auth-card h1 { font-family: 'Fraunces', serif; font-size: 26px; font-weight: 500; margin: 0 0 6px; }
  .auth-sub { color: var(--text-dim); font-size: 14px; margin: 0; line-height: 1.5; }
  .auth-card button[type='submit'] { width: 100%; margin-top: 20px; padding: 12px; }

  .wrap { max-width: 640px; margin: 0 auto; padding: 28px 20px 60px; }
  .header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 22px; }
  .user-email { color: var(--text-dim); font-size: 13px; }
  .toolbar { display: flex; gap: 10px; margin-bottom: 20px; }
  .search { flex: 1; }
  .empty-state { padding: 48px 16px; text-align: center; color: var(--text-dim); }
  .list { display: flex; flex-direction: column; gap: 10px; }
  .row { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; }
  .row-main { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .row-name { font-weight: 600; font-size: 15px; }
  .row-owner { color: var(--text-dim); font-size: 13px; }
  .row-password { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .pw-text { font-family: 'JetBrains Mono', monospace; font-size: 14px; letter-spacing: 0.03em; color: var(--accent); flex: 1; overflow-wrap: anywhere; }
  .row-notes { margin-top: 10px; font-size: 13px; color: var(--text-dim); white-space: pre-wrap; line-height: 1.5; border-top: 1px solid var(--border); padding-top: 10px; }
  .row-actions { display: flex; gap: 8px; margin-top: 12px; }
  .icon-btn { background: var(--surface-raised); color: var(--text-dim); border: 1px solid var(--border); padding: 6px 12px; font-size: 12px; font-weight: 500; }
  .icon-btn:hover { color: var(--text); filter: none; }
  .icon-btn.danger:hover { color: var(--danger); border-color: var(--danger); }
  .form-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px 20px; }
  .form-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }

  @media (max-width: 480px) {
    .toolbar { flex-direction: column; }
    .row-main { flex-direction: column; gap: 2px; }
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<div id="authScreen" class="auth-screen" hidden>
  <div class="auth-card">
    <div class="mark">VAULT</div>
    <h1 id="authTitle">Sign in</h1>
    <p class="auth-sub" id="authSub">Access your stored logins.</p>
    <form id="authForm">
      <label for="email">Email</label>
      <input id="email" type="email" required autocomplete="email" />
      <label for="password">Password</label>
      <input id="password" type="password" required minlength="6" autocomplete="current-password" />
      <button type="submit" id="authSubmit">Sign in</button>
    </form>
    <div id="authMsg"></div>
    <button class="link-btn" id="authToggle">Don't have an account? Create one</button>
  </div>
</div>

<div id="vaultScreen" class="wrap" hidden>
  <div class="header">
    <div>
      <div class="mark">VAULT</div>
      <div class="user-email" id="userEmail"></div>
    </div>
    <button class="btn-ghost" id="signOutBtn">Sign out</button>
  </div>

  <div id="listView">
    <div class="toolbar">
      <input id="search" class="search" placeholder="Search by name, owner, or notes" />
      <button id="addBtn">Add entry</button>
    </div>
    <div id="vaultMsg"></div>
    <div id="listWrap"><div class="empty-state">Loading…</div></div>
  </div>

  <div id="formView" hidden>
    <div class="form-card">
      <h3 id="formTitle" style="margin-top:0;font-family:'Fraunces',serif;font-weight:500;"></h3>
      <form id="entryForm">
        <label for="f-owner">Owner</label>
        <input id="f-owner" required placeholder="e.g. Jeff" />
        <label for="f-name">Name</label>
        <input id="f-name" required placeholder="e.g. Bank of Northwest MO" />
        <label for="f-password">Password</label>
        <input id="f-password" required placeholder="Password" />
        <label for="f-notes">Notes</label>
        <textarea id="f-notes" rows="3" placeholder="Username, security questions, anything else"></textarea>
        <div class="form-actions">
          <button type="button" id="cancelBtn" class="btn-ghost">Cancel</button>
          <button type="submit" id="saveBtn">Save entry</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>
  // Paste in the two values from your Supabase project's Settings -> API page,
  // then save this file. That's the only setup this app needs.
  //
  // The anon key is safe to have here — it's meant to be public.
  // Your data is actually protected by the Row Level Security rules
  // in supabase_schema.sql, not by hiding this key.
  const SUPABASE_URL = 'https://YOUR-PROJECT-REF.supabase.co';
  const SUPABASE_ANON_KEY = 'YOUR-ANON-PUBLIC-KEY';

  const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ---------- element refs ----------
  const authScreen = document.getElementById('authScreen');
  const vaultScreen = document.getElementById('vaultScreen');
  const authForm = document.getElementById('authForm');
  const authTitle = document.getElementById('authTitle');
  const authSub = document.getElementById('authSub');
  const authSubmit = document.getElementById('authSubmit');
  const authToggle = document.getElementById('authToggle');
  const authMsg = document.getElementById('authMsg');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');

  const userEmail = document.getElementById('userEmail');
  const signOutBtn = document.getElementById('signOutBtn');
  const listView = document.getElementById('listView');
  const formView = document.getElementById('formView');
  const listWrap = document.getElementById('listWrap');
  const vaultMsg = document.getElementById('vaultMsg');
  const searchInput = document.getElementById('search');
  const addBtn = document.getElementById('addBtn');
  const cancelBtn = document.getElementById('cancelBtn');
  const entryForm = document.getElementById('entryForm');
  const formTitle = document.getElementById('formTitle');

  let authMode = 'sign_in';
  let session = null;
  let entries = [];
  let editingId = null;

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str ?? '';
    return d.innerHTML;
  }

  // ---------- auth ----------
  authToggle.addEventListener('click', () => {
    authMode = authMode === 'sign_in' ? 'sign_up' : 'sign_in';
    authMsg.innerHTML = '';
    if (authMode === 'sign_in') {
      authTitle.textContent = 'Sign in';
      authSub.textContent = 'Access your stored logins.';
      authSubmit.textContent = 'Sign in';
      authToggle.textContent = "Don't have an account? Create one";
      passwordInput.autocomplete = 'current-password';
    } else {
      authTitle.textContent = 'Create your account';
      authSub.textContent = 'This will be the only account with access to your vault.';
      authSubmit.textContent = 'Create account';
      authToggle.textContent = 'Already have an account? Sign in';
      passwordInput.autocomplete = 'new-password';
    }
  });

  authForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    authSubmit.disabled = true;
    authSubmit.textContent = 'Working…';
    authMsg.innerHTML = '';

    const email = emailInput.value;
    const password = passwordInput.value;

    if (authMode === 'sign_in') {
      const { error } = await client.auth.signInWithPassword({ email, password });
      if (error) authMsg.innerHTML = `<div class="msg error">${escapeHtml(error.message)}</div>`;
    } else {
      const { error } = await client.auth.signUp({ email, password });
      if (error) {
        authMsg.innerHTML = `<div class="msg error">${escapeHtml(error.message)}</div>`;
      } else {
        authMsg.innerHTML = `<div class="msg success">Account created. Check your email to confirm, then sign in.</div>`;
      }
    }
    authSubmit.disabled = false;
    authSubmit.textContent = authMode === 'sign_in' ? 'Sign in' : 'Create account';
  });

  signOutBtn.addEventListener('click', () => client.auth.signOut());

  client.auth.onAuthStateChange((_event, s) => {
    session = s;
    if (session) {
      authScreen.hidden = true;
      vaultScreen.hidden = false;
      userEmail.textContent = session.user.email;
      loadEntries();
    } else {
      vaultScreen.hidden = true;
      authScreen.hidden = false;
    }
  });

  // ---------- vault ----------
  async function loadEntries() {
    vaultMsg.innerHTML = '';
    const { data, error } = await client.from('passwords').select('*').order('name', { ascending: true });
    if (error) {
      vaultMsg.innerHTML = `<div class="msg error">${escapeHtml(error.message)}</div>`;
      return;
    }
    entries = data;
    render();
  }

  function openForm(entry) {
    editingId = entry ? entry.id : null;
    formTitle.textContent = entry ? 'Edit entry' : 'Add entry';
    document.getElementById('f-owner').value = entry ? entry.owner : '';
    document.getElementById('f-name').value = entry ? entry.name : '';
    document.getElementById('f-password').value = entry ? entry.password : '';
    document.getElementById('f-notes').value = entry ? entry.notes || '' : '';
    listView.hidden = true;
    formView.hidden = false;
    document.getElementById('f-owner').focus();
  }

  function closeForm() {
    formView.hidden = true;
    listView.hidden = false;
    editingId = null;
  }

  addBtn.addEventListener('click', () => openForm(null));
  cancelBtn.addEventListener('click', closeForm);
  searchInput.addEventListener('input', render);

  entryForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const owner = document.getElementById('f-owner').value.trim();
    const name = document.getElementById('f-name').value.trim();
    const password = document.getElementById('f-password').value;
    const notes = document.getElementById('f-notes').value.trim();
    if (!owner || !name || !password) return;

    const saveBtn = document.getElementById('saveBtn');
    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving…';

    let error;
    if (editingId) {
      ({ error } = await client.from('passwords').update({ owner, name, password, notes }).eq('id', editingId));
    } else {
      ({ error } = await client.from('passwords').insert({ owner, name, password, notes, user_id: session.user.id }));
    }

    saveBtn.disabled = false;
    saveBtn.textContent = 'Save entry';

    if (error) {
      vaultMsg.innerHTML = `<div class="msg error">${escapeHtml(error.message)}</div>`;
      return;
    }
    closeForm();
    loadEntries();
  });

  async function deleteEntry(id) {
    const entry = entries.find((x) => x.id === id);
    if (!entry) return;
    if (!confirm(`Delete the entry for "${entry.name}"? This can't be undone.`)) return;
    const { error } = await client.from('passwords').delete().eq('id', id);
    if (error) {
      vaultMsg.innerHTML = `<div class="msg error">${escapeHtml(error.message)}</div>`;
      return;
    }
    entries = entries.filter((x) => x.id !== id);
    render();
  }

  function render() {
    const q = searchInput.value.trim().toLowerCase();
    const filtered = !q
      ? entries
      : entries.filter(
          (e) =>
            e.name.toLowerCase().includes(q) ||
            e.owner.toLowerCase().includes(q) ||
            (e.notes || '').toLowerCase().includes(q)
        );

    if (entries.length === 0) {
      listWrap.innerHTML = `<div class="empty-state">No entries yet. Add your first one.</div>`;
      return;
    }
    if (filtered.length === 0) {
      listWrap.innerHTML = `<div class="empty-state">Nothing matches that search.</div>`;
      return;
    }

    listWrap.innerHTML = `<div class="list">${filtered.map(rowHtml).join('')}</div>`;

    filtered.forEach((entry) => {
      const row = document.getElementById(`row-${entry.id}`);
      const showBtn = row.querySelector('.show-btn');
      const copyBtn = row.querySelector('.copy-btn');
      const pwText = row.querySelector('.pw-text');
      let revealed = false;

      showBtn.addEventListener('click', () => {
        revealed = !revealed;
        pwText.textContent = revealed ? entry.password : '••••••••';
        showBtn.textContent = revealed ? 'Hide' : 'Show';
      });

      copyBtn.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(entry.password);
          copyBtn.textContent = 'Copied';
          setTimeout(() => (copyBtn.textContent = 'Copy'), 1500);
        } catch (e) {}
      });

      row.querySelector('.edit-btn').addEventListener('click', () => openForm(entry));
      row.querySelector('.delete-btn').addEventListener('click', () => deleteEntry(entry.id));
    });
  }

  function rowHtml(entry) {
    return `
      <div class="row" id="row-${entry.id}">
        <div class="row-main">
          <div class="row-name">${escapeHtml(entry.name)}</div>
          <div class="row-owner">${escapeHtml(entry.owner)}</div>
        </div>
        <div class="row-password">
          <span class="pw-text">••••••••</span>
          <button type="button" class="icon-btn show-btn">Show</button>
          <button type="button" class="icon-btn copy-btn">Copy</button>
        </div>
        ${entry.notes ? `<div class="row-notes">${escapeHtml(entry.notes)}</div>` : ''}
        <div class="row-actions">
          <button type="button" class="icon-btn edit-btn">Edit</button>
          <button type="button" class="icon-btn danger delete-btn">Delete</button>
        </div>
      </div>
    `;
  }

  // ---------- boot ----------
  client.auth.getSession().then(({ data: { session: s } }) => {
    session = s;
    if (session) {
      authScreen.hidden = true;
      vaultScreen.hidden = false;
      userEmail.textContent = session.user.email;
      loadEntries();
    } else {
      authScreen.hidden = false;
    }
  });
</script>
</body>
</html>
